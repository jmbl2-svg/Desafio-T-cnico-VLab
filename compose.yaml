services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATA_DIR: /data
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-12}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS-gemini-3.8-flash,gemini-3.6-flash}
    volumes:
      - vlab-data:/data

volumes:
  vlab-data:
