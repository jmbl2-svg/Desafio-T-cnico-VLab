<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suporte técnico | V-LAB</title>
<style>
:root { color-scheme: light; --fundo:#eaf0f5; --painel:#fff; --texto:#182b3c; --muted:#456075; --linha:#c4d3df; --acao:#086b59; }
* { box-sizing:border-box; }
body { font: 16px system-ui, sans-serif; background:var(--fundo); color:var(--texto); margin:0; }
main { max-width:980px; margin:2rem auto; padding:0 1rem; display:grid; gap:1rem; }
h1,h2 { margin:0 0 .8rem; }
section { background:var(--painel); border:1px solid var(--linha); border-radius:12px; padding:1rem; }
form { display:grid; gap:.65rem; }
label { display:grid; gap:.25rem; }
input,select,textarea { width:100%; font:inherit; background:var(--painel); color:var(--texto); border:1px solid var(--linha); border-radius:6px; padding:.55rem; }
button { width:max-content; border:0; border-radius:6px; background:var(--acao); color:#fff; padding:.65rem 1rem; font:inherit; cursor:pointer; }
button:disabled { opacity:.65; cursor:wait; }
pre { white-space:pre-wrap; overflow-wrap:anywhere; color:var(--texto); }
#status { margin:0; color:var(--muted); }
#comparacoes,#notas { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1rem; margin:1rem 0; }
fieldset { border:1px solid var(--linha); border-radius:8px; min-width:0; display:grid; gap:.5rem; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main>
<header><h1>Assistente de suporte V-LAB</h1><button id="sair" hidden>Sair</button></header>
<p id="status" role="status" aria-live="polite"></p>
<section id="conta" hidden>
<h2>Acesso</h2>
<form id="credenciais">
<label>Usuário<input name="usuario" autocomplete="username" required minlength="3" maxlength="64"></label>
<label>Senha<input name="senha" type="password" autocomplete="current-password" required minlength="10" maxlength="128"></label>
<button name="acao" value="login">Entrar</button>
<button name="acao" value="registro">Criar conta e entrar</button>
</form>
</section>
<section id="painel" hidden>
<h2>Atendimento</h2>
<form id="cenario">
<label>Perfil<select name="perfil" required></select></label>
<label>Ticket<select name="ticketId"></select></label>
<label>Relato livre<textarea name="ticket" rows="3" maxlength="12000"></textarea></label>
<label>Tipo<select name="tipo">
<option value="resolucao">Resolução</option><option value="diagnostico">Diagnóstico</option>
<option value="perguntas">Perguntas</option><option value="fluxo">Fluxo</option>
</select></label>
<label>Versão<select name="versao"><option>v1</option><option>v2</option></select></label>
<button id="gerar">Gerar resposta</button>
<button type="button" id="comparar">Comparar v1 e v2</button>
</form>
<pre id="saida"></pre>
<div id="dupla" hidden>
  <div id="comparacoes"></div>
  <form id="rubrica">
    <label>Avaliador<input name="avaliador" required maxlength="120"></label>
    <div id="notas"></div>
    <label>Conclusão comparativa<textarea name="conclusao" required></textarea></label>
    <button id="salvar-notas">Salvar rubrica</button>
  </form>
</div>
</section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const form = $("cenario");
const status = $("status");
const informar = (mensagem) => { status.textContent = mensagem; };

async function api(url, metodo = "GET", corpo) {
  const opcoes = { method: metodo };
  if (corpo !== undefined) {
    opcoes.headers = { "Content-Type": "application/json" };
    opcoes.body = JSON.stringify(corpo);
  }
  const resposta = await fetch(url, opcoes);
  if (resposta.status === 204) return null;
  const dados = await resposta.json();
  if (!resposta.ok) {
    throw new Error(typeof dados.detail === "string" ? dados.detail : "Confira os campos informados.");
  }
  return dados;
}

async function carregarCatalogos() {
  const [perfis, tickets] = await Promise.all([api("/api/perfis"), api("/api/tickets")]);
  form.elements.perfil.replaceChildren(...perfis.map(p => new Option(
    `${p.id} · ${p.nome} · ${p.nivel} / ${p.estilo} / ${p.canal}`, p.id
  )));
  form.elements.ticketId.replaceChildren(new Option("Usar relato livre", ""), ...tickets.map(
    t => new Option(t.titulo, t.id)
  ));
}

function cenario(versao = form.elements.versao.value) {
  const ticket = form.elements.ticket.value.trim();
  return {
    perfil_id: form.elements.perfil.value,
    tipo: form.elements.tipo.value,
    versao,
    ...(ticket ? { ticket } : { ticket_id: form.elements.ticketId.value }),
  };
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  $("gerar").disabled = true;
  informar("Gerando resposta...");
  try {
    const dados = await api("/api/execucoes", "POST", cenario());
    $("saida").textContent = JSON.stringify(dados.saida, null, 2);
    informar(`Atendimento ${dados.run_id} salvo · ${dados.registro.provedor}`);
  } catch (erro) {
    informar(erro.message);
  } finally {
    $("gerar").disabled = false;
  }
});

const criterios = {
  clarity: "Clareza",
  customer_fit: "Adequação ao cliente",
  actionability: "Acionabilidade",
};
let parAtivo;

function montarRubrica(execucao) {
  const grupo = document.createElement("fieldset");
  const titulo = document.createElement("legend");
  titulo.textContent = `${execucao.registro.versao} · ${execucao.run_id}`;
  grupo.append(titulo);
  for (const [chave, rotulo] of Object.entries(criterios)) {
    const base = `${execucao.run_id}:${chave}`;
    const labelNota = document.createElement("label");
    labelNota.textContent = `${rotulo} (1 a 5)`;
    const nota = document.createElement("input");
    Object.assign(nota, { type:"number", min:"1", max:"5", step:"1", required:true, name:base });
    labelNota.append(nota);
    const labelTexto = document.createElement("label");
    labelTexto.textContent = "Justificativa";
    const texto = document.createElement("textarea");
    Object.assign(texto, { required:true, name:base + ":texto", rows:2 });
    labelTexto.append(texto);
    grupo.append(labelNota, labelTexto);
  }
  return grupo;
}

$("comparar").addEventListener("click", async () => {
  $("comparar").disabled = true;
  $("gerar").disabled = true;
  $("dupla").hidden = true;
  informar("Gerando as duas versões...");
  try {
    const base = cenario("v1");
    const v1 = await api("/api/execucoes", "POST", { ...base, sem_cache:true });
    const v2 = await api("/api/execucoes", "POST", { ...base, versao:"v2", sem_cache:true });
    parAtivo = await api("/api/comparacoes", "POST", { run_ids:[v1.run_id, v2.run_id] });
    $("comparacoes").replaceChildren(...[v1,v2].map(execucao => {
      const cartao = document.createElement("section");
      const h = document.createElement("h2");
      const pre = document.createElement("pre");
      h.textContent = `${execucao.registro.versao} · ${execucao.registro.modelo}`;
      pre.textContent = JSON.stringify(execucao.saida, null, 2);
      cartao.append(h,pre);
      return cartao;
    }));
    $("rubrica").reset();
    $("notas").replaceChildren(...[v1,v2].map(montarRubrica));
    $("dupla").hidden = false;
    informar(v1.registro.provedor === "fake" ? "Par criado em modo simulado." : "Par criado. Avalie as respostas.");
  } catch (erro) {
    informar(erro.message);
  } finally {
    $("comparar").disabled = false;
    $("gerar").disabled = false;
  }
});

$("rubrica").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!parAtivo) return;
  const campos = new FormData(e.currentTarget);
  const notas = {};
  for (const id of parAtivo.run_ids) {
    notas[id] = {};
    for (const chave of Object.keys(criterios)) {
      const base = `${id}:${chave}`;
      notas[id][chave] = { nota:Number(campos.get(base)), justificativa:campos.get(base + ":texto") };
    }
  }
  $("salvar-notas").disabled = true;
  try {
    await api("/api/comparacoes/" + parAtivo.comparison_id + "/avaliacao", "PUT", {
      avaliador:campos.get("avaliador"), conclusao:campos.get("conclusao"), notas,
    });
    informar("Rubrica salva.");
  } catch (erro) {
    informar(erro.message);
  } finally {
    $("salvar-notas").disabled = false;
  }
});

async function aplicarSessao(usuario) {
  $("conta").hidden = Boolean(usuario);
  $("painel").hidden = !usuario;
  $("sair").hidden = !usuario;
  if (usuario) await carregarCatalogos();
}

$("credenciais").addEventListener("submit", async (e) => {
  e.preventDefault();
  const conta = e.currentTarget;
  const campos = new FormData(conta);
  const corpo = { usuario: campos.get("usuario"), senha: campos.get("senha") };
  try {
    if (e.submitter?.value === "registro") await api("/api/auth/registro", "POST", corpo);
    const dados = await api("/api/auth/login", "POST", corpo);
    conta.reset();
    await aplicarSessao(dados.usuario);
    informar("");
  } catch (erro) {
    informar(erro.message);
  }
});

$("sair").addEventListener("click", async () => {
  try {
    await api("/api/auth/logout", "POST");
    location.reload();
  } catch (erro) {
    informar(erro.message);
  }
});

api("/api/auth/sessao").then(dados => aplicarSessao(dados.usuario)).catch(erro => informar(erro.message));
</script>
</body>
</html>
